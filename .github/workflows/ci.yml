name: Validate learning lab
on:
  push:
    branches: [main, build/visible-ai-lab]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Numerical and gradient tests
        run: npm test
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Native HTTP, file and interactive tests
        run: npm run test:e2e
      - name: Bundle source
        if: always()
        run: git archive --format=zip --output=visible-ai-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-lab-validation
          include-hidden-files: true
          path: |
            .test-output/
            visible-ai-source.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: visible-ai-offline
          path: dist/
          retention-days: 14
